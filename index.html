<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger: your academic roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F2F6;--surface:#FFF;--ink:#211B33;--muted:#6B6580;--line:#DAD6E4;--plum:#5B3A6B;--sage:#3F7A55;--brass:#A9833F;--tint:#E9E4F0;--bad:#B5485A;--warn:#A8741A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media (prefers-color-scheme:dark){:root{--bg:#17131F;--surface:#221D2E;--ink:#EEEAF5;--muted:#A49DB8;--line:#3A3349;--plum:#B692CC;--sage:#7FBF98;--brass:#D2AE6C;--tint:#2D2640;--bad:#E0788A;--warn:#E0B25A}}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'DM Sans',system-ui,sans-serif}
body.read{font:400 18px/1.75 'Atkinson Hyperlegible',sans-serif}body.read h1,body.read h2,body.read h3,body.read .brand{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.05}
input,select,button,textarea{font-family:inherit}:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:9;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 6px}
.brand{font:italic 600 28px 'Cormorant Garamond',Georgia,serif}.brand small{font:400 13px 'DM Sans',sans-serif;color:var(--muted);margin-left:8px;font-style:normal}
nav{display:flex;gap:16px;flex-wrap:wrap}nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 14px 'DM Sans',sans-serif;cursor:pointer;padding:6px 0}
nav button[aria-pressed=true]{color:var(--ink);border-color:var(--brass)}
h2.t{font-size:clamp(34px,5vw,54px);margin:22px 0 4px}.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}.card h3{font-size:26px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}.stats .card{margin:0;padding:14px 16px}
.stat span{font-size:12.5px;color:var(--muted);display:block}.stat b{font:500 36px/1.1 'Cormorant Garamond',Georgia,serif;display:block;margin:3px 0}.stat small{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.g2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.none{color:var(--muted);font-size:14px;margin:6px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;border:1px solid var(--line)}
.ok{color:var(--sage);border-color:var(--sage)}.mid{color:var(--warn);border-color:var(--warn)}.low{color:var(--bad);border-color:var(--bad)}
form label,.f label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:9px 11px;font-size:15px;margin-top:4px}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.pri{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 22px;font-weight:600;font-size:14px;cursor:pointer;margin-top:14px;width:auto}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:13.5px;cursor:pointer;width:auto;margin:8px 8px 0 0}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;width:auto;padding:0 6px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modes label{margin:0;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink);font-size:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12.5px;color:var(--muted);font-weight:600}
tr.go{cursor:pointer}tr.go:hover{background:var(--tint)}
.bar{position:relative;height:10px;background:var(--tint);border-radius:9px;margin:5px 0 12px}.bar i{display:block;height:100%;border-radius:9px;background:var(--plum)}.bar b{position:absolute;top:-4px;width:3px;height:18px;background:var(--brass);border-radius:2px}
.bl{display:flex;justify-content:space-between;font-size:14px;gap:8px}.bl span:last-child{color:var(--muted);font-size:13px}
ul.ins{margin:0;padding-left:20px}ul.ins li{margin:6px 0}
.srow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.srow label{flex:1;margin:0;color:var(--ink);font-size:14.5px}.srow select{width:auto;margin:0}
.lg{font-size:12.5px;color:var(--muted);margin-top:4px}a{color:var(--plum);text-underline-offset:3px}textarea{resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw}.toast.on{opacity:1}
@media (max-width:800px){.g2,.g2b{grid-template-columns:1fr}.row{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="wrap">
<header class="top"><div class="brand">Ledger<small>IB grade dashboard</small></div>
<nav id="nav" aria-label="Sections"><button data-v="ov">Overview</button><button data-v="sb">Subjects</button><button data-v="ad">Add score</button><button data-v="gl">Goals</button><button data-v="un">Universities</button><button data-v="ex">Activities</button><button data-v="pl">Subject plan</button><button data-v="cal">Calendar & tasks</button><button data-v="cr">Criteria tracker</button><button data-v="st">Settings</button><button id="theme" aria-label="Toggle easy-read text" aria-pressed="false">Aa</button></nav></header>
<main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- data and settings ---------- */
const MYPL=["English (Language & Literature)","Spanish","French","Hindi","German","Mathematics","Science","Biology","Chemistry","Physics","Computer Science","History","Geography","Economics","Business Management","Art","Design","Physical and Health Education","Music"];
const DPL=["English A: Literature","English A: Language & Literature","Spanish B","French B","Hindi B","German B","History","Geography","Economics","Business Management","Psychology","Biology","Chemistry","Physics","Computer Science","Maths: Analysis & Approaches","Maths: Applications & Interpretation","Visual Arts","Music","Theatre"];
const TYPES=["SDL","Formative (FA)","Mid-term exam","Half-yearly exam","Mock exam","Summative (SA)","Practice paper","Quiz"];
const KEY="ledger:v1",DEFB=[80,70,60,50,40,30];
let S=null,V="ov",DETAIL=null;
try{S=JSON.parse(localStorage.getItem(KEY));if(S){S.unis=S.unis||[];S.activities=S.activities||[];S.plan=S.plan||{};S.events=S.events||[];S.criteria=S.criteria||[];S.tasks=S.tasks||[];}}catch(e){}
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save in this browser")}};
const r1=n=>Math.round(n*10)/10,today=()=>new Date().toISOString().slice(0,10),dpOn=()=>S&&S.grade>=11;
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
function defExam(g){const n=new Date(),y=n.getFullYear()+(n.getMonth()>=5?1:0);return(y+Math.max(0,(g>=11?12:10)-g))+"-05-15"}

/* ---------- grade maths (all editable boundaries live in S.b) ---------- */
const lo=g=>g<=1?0:S.b[7-g],hi=g=>g>=7?100:lo(g+1),mid=g=>(lo(g)+hi(g))/2;
const gradeOf=p=>{for(let g=7;g>=2;g--)if(p>=lo(g))return g;return 1};
const wavg=a=>a.length?a.reduce((sum,i)=>sum+i.pct,0)/a.length:null;
function stats(sub){const it=S.items.filter(i=>i.sub===sub.id).sort((a,b)=>a.d.localeCompare(b.d)),W=it.length,avg=wavg(it);
 return{it,W,avg,g:avg==null?null:gradeOf(avg),tr:it.length>=4?wavg(it.slice(-2))-wavg(it.slice(-4,-2)):null}}
function overall(){const rows=S.subjects.map(s=>({s,...stats(s)})),have=rows.filter(r=>r.avg!=null),dp=dpOn();
 const avg=have.length?have.reduce((a,r)=>a+r.avg,0)/have.length:null,gs=have.map(r=>r.g).sort((a,b)=>b-a),lvl=gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:null;
 const srt=[...have].sort((a,b)=>b.avg-a.avg);let pts=null,est=false;
 if(gs.length){if(gs.length>=6)pts=gs.slice(0,6).reduce((a,b)=>a+b,0);else{pts=Math.round(lvl*6);est=true}pts+=S.bonus||0}
 return{rows,have,avg,lvl,pts,est,dp,best:srt[0],worst:srt.length>1?srt[srt.length-1]:null}}
const targetAvg=()=>dpOn()?Math.min(7,Math.max(1,(S.target-(S.bonus||0))/6)):S.target;
const targetPct=()=>mid(Math.round(Math.min(7,Math.max(1,targetAvg()))));
const need=(sub,tg,n)=>{const st=stats(sub);return(lo(tg)*(st.W+n)-(st.avg||0)*st.W)/n};
function series(){let sum=0,n=0;return[...S.items].sort((a,b)=>a.d.localeCompare(b.d)).map(i=>{sum+=i.pct;n++;return{d:i.d,v:sum/n}})}
function status(o){if(o.pts==null)return["No data yet","mid"];const d=dpOn()?o.pts-S.target:(o.lvl-S.target)*6;return d>=0?["On track","ok"]:d>=-2.5?["Close","mid"]:["Behind","low"]}
function projPts(o){return o.pts!=null?o.pts:null}

/* ---------- charts ---------- */
function trend(){const p=series();if(!p.length)return'<p class="none">Add a score to start your graph.</p>';
 const t0=Date.parse(p[0].d),ex=Date.parse(S.exam)||Date.parse(defExam(S.grade)),tE=Math.max(ex,Date.parse(p[p.length-1].d)+12096e5),W=640,H=270,l=34,r=30,t=12,b=24;
 const x=ms=>l+(ms-t0)/((tE-t0)||1)*(W-l-r),y=v=>t+(100-v)/100*(H-t-b),tp=targetPct();let g="";
 for(let k=7;k>=2;k--)g+=`<line x1="${l}" x2="${W-r}" y1="${y(lo(k))}" y2="${y(lo(k))}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W-r+5}" y="${y(lo(k))+4}" font-size="11" fill="var(--muted)">${k}</text>`;
 [0,50,100].forEach(v=>g+=`<text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`);
 g+=`<line x1="${x(t0)}" y1="${y(p[0].v)}" x2="${x(tE)}" y2="${y(tp)}" stroke="var(--brass)" stroke-width="2" stroke-dasharray="7 5"/><circle cx="${x(tE)}" cy="${y(tp)}" r="5" fill="var(--brass)"><title>Target: about ${r1(tp)}%</title></circle>`;
 g+=`<polyline fill="none" stroke="var(--plum)" stroke-width="2.6" points="${p.map(q=>x(Date.parse(q.d))+","+y(q.v)).join(" ")}"/>`+p.map(q=>`<circle cx="${x(Date.parse(q.d))}" cy="${y(q.v)}" r="4" fill="var(--plum)"><title>${q.d}: ${r1(q.v)}% running average</title></circle>`).join("");
 g+=`<text x="${l}" y="${H-6}" font-size="11" fill="var(--muted)">${p[0].d}</text><text x="${W-r}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${new Date(tE).toISOString().slice(0,10)}</text>`;
 const last=p[p.length-1],idl=p[0].v+(tp-p[0].v)*((Date.parse(last.d)-t0)/((tE-t0)||1));
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running average score over time compared with the ideal path to your target" style="width:100%;height:auto">${g}</svg><p class="lg"><b style="color:var(--plum)">&#9644;</b> your running average &nbsp; <b style="color:var(--brass)">- -</b> ideal path to your target &nbsp; grade lines 2 to 7 on the right</p><p class="none">${last.v>=idl?"You are "+r1(last.v-idl)+" points ahead of the ideal path.":"You are "+r1(idl-last.v)+" points behind the ideal path."}</p>`}
function spark(v){if(v.length<2)return"";const w=84,h=22,mn=Math.min(...v),mx=Math.max(...v),s=mx-mn||1;return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--plum)" stroke-width="2" points="${v.map((q,i)=>(i/(v.length-1)*(w-4)+2)+","+(h-3-(q-mn)/s*(h-6))).join(" ")}"/></svg>`}
const arrow=t=>t==null?"–":t>=3?"▲":t<=-3?"▼":"►";
const lvl=s=>dpOn()&&s.level?` <small class="none">${s.level}</small>`:"";

/* ---------- views ---------- */
function vOv(){const o=overall(),st=status(o),dp=dpOn(),pp=projPts(o);
 const card=(l,v,s)=>`<div class="card stat"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
 let h=`<h2 class="t">Hello, ${esc(S.name||"there")}</h2><p class="sub">${dp?"Diploma Programme, grade "+S.grade+" (DP "+(S.grade-10)+")":"Middle Years Programme, grade "+S.grade+" (MYP "+(S.grade-5)+")"} · goal ${dp?S.target+" points":"average grade "+S.target} · <span class="chip ${st[1]}">${st[0]}</span></p><div class="stats">`+
 card("Average score",o.avg==null?"–":r1(o.avg)+"%",S.items.length+" scores logged")+
 card(dp?"Predicted IB points":"Average level",o.pts==null?"–":dp?o.pts:r1(o.lvl),dp?(o.est?"estimate from "+o.have.length+" subject(s) · out of 45":"best 6 + "+(S.bonus||0)+" core · out of 45"):"out of 7")+
 card("Strongest subject",o.best?esc(o.best.s.name):"–",o.best?r1(o.best.avg)+"% · grade "+o.best.g:"Log scores to see")+
 card("Needs attention",o.worst?esc(o.worst.s.name):"–",o.worst?r1(o.worst.avg)+"% · grade "+o.worst.g:"Needs 2+ subjects")+`</div>`;
 h+=`<div class="g2"><div class="card"><h3>Progress and ideal path</h3>${trend()}</div><div class="card"><h3>Subjects vs your targets</h3>`+
  (o.rows.map(r=>`<div class="bl"><span>${esc(r.s.name)}${lvl(r.s)}</span><span>${r.g==null?"no scores":"grade "+r.g+" of target "+r.s.target}</span></div><div class="bar" role="img" aria-label="${esc(r.s.name)}: ${r.g||0} of 7, target ${r.s.target}"><i style="width:${(r.g||0)/7*100}%"></i><b style="left:calc(${r.s.target/7*100}% - 1px)"></b></div>`).join("")||'<p class="none">Add your subjects in Settings.</p>')+`</div></div>`;
 const a=[];
 if(o.best)a.push(`Your strongest subject is <b>${esc(o.best.s.name)}</b> at ${r1(o.best.avg)}%.`);
 if(o.worst)a.push(`<b>${esc(o.worst.s.name)}</b> is lowest at ${r1(o.worst.avg)}%. Raising it by one grade adds a point to your total.`);
 const far=o.have.map(r=>({r,d:r.s.target-r.g})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d)[0];
 if(far)a.push(`Furthest below target: <b>${esc(far.r.s.name)}</b>, grade ${far.r.g} against a target of ${far.r.s.target}.`);
 o.have.filter(r=>r.tr!=null&&r.tr>=3).forEach(r=>a.push(`${esc(r.s.name)} is improving (+${r1(r.tr)} points on recent work).`));
 o.have.filter(r=>r.tr!=null&&r.tr<=-3).forEach(r=>a.push(`${esc(r.s.name)} is slipping (${r1(r.tr)} points on recent work). Worth a closer look.`));
 if(dp&&o.pts!=null){const d=S.target-o.pts;a.push(d>0?`You are ${d} point${d>1?"s":""} short of your ${S.target}-point goal. That is about +${r1(d/6)} grade in each of your six scoring subjects.`:`You are on or above your ${S.target}-point goal. Keep it steady.`)}
 S.unis.forEach(u=>{if(pp!=null){const d=u.pts-pp;a.push(d>0?`${esc(u.n)} needs ${u.pts} points: you are ${d} short right now.`:`${esc(u.n)} needs ${u.pts} points: your current prediction meets it.`)}});
 h+=`<div class="card"><h3>What this means</h3>${a.length?`<ul class="ins">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:'<p class="none">Add a few scores and your insights will appear here.</p>'}</div>`;
 return h}
function vSb(){const o=overall();let h=`<h2 class="t">Subjects</h2><p class="sub">Select a subject to see every score in it.</p><div class="card tw"><table><caption class="none" style="text-align:left">Average per subject</caption><thead><tr><th>Subject</th><th>Average</th><th>Grade</th><th>Target</th><th>Gap</th><th>Trend</th><th>Scores</th><th></th></tr></thead><tbody>`+
 o.rows.map(r=>{const gap=r.g==null?null:r.s.target-r.g;return`<tr class="go" tabindex="0" data-sub="${r.s.id}"><td>${esc(r.s.name)}${lvl(r.s)}</td><td>${r.avg==null?"–":r1(r.avg)+"%"}</td><td>${r.g||"–"}</td><td>${r.s.target}</td><td>${gap==null?"–":gap>0?'<span class="chip low">-'+gap+"</span>":'<span class="chip ok">on target</span>'}</td><td>${arrow(r.tr)}</td><td>${r.it.length}</td><td>${spark(r.it.map(i=>i.pct))}</td></tr>`}).join("")+`</tbody></table></div>`;
 const d=DETAIL&&S.subjects.find(s=>s.id===DETAIL);
 if(d){const st=stats(d);h+=`<div class="card"><h3>${esc(d.name)}</h3>${st.it.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Score</th><th>%</th><th>Note</th><th></th></tr></thead><tbody>`+[...st.it].reverse().map(i=>`<tr><td>${i.d}</td><td>${esc(i.type)}</td><td>${esc(i.raw||"")}</td><td>${r1(i.pct)}%</td><td>${esc(i.note||"")}</td><td><button class="x" data-del="${i.id}" aria-label="Delete this score">×</button></td></tr>`).join("")+`</tbody></table></div>`:'<p class="none">No scores yet.</p>'}</div>`}
 return h}
function vAd(){const sel=S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
 if(!S.subjects.length)return`<h2 class="t">Add a score</h2><p class="none">Choose your subjects in Settings first.</p>`;
 const rec=[...S.items].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,8);
 return`<h2 class="t">Add a score</h2><p class="sub">Enter it however your teacher gave it: marks, a percentage, or an IB grade.</p><div class="g2b"><form class="card" id="fa" style="margin-top:0"><label>Subject<select name="sub">${sel}</select></label><div class="row"><label>Type<select name="type" id="ft">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select></label><label>Date<input type="date" name="d" value="${today()}" required></label></div>
 <div class="modes" role="radiogroup" aria-label="How was it marked"><label><input type="radio" name="mode" value="marks" checked>Marks</label><label><input type="radio" name="mode" value="pct">Percent</label><label><input type="radio" name="mode" value="grade">IB grade</label></div>
 <div class="row mm" data-m="marks"><label>Your marks<input name="raw" type="number" min="0" step="any"></label><label>Out of<input name="out" type="number" min="1" step="any" value="100"></label></div>
 <div class="mm" data-m="pct" hidden><label>Percent<input name="p" type="number" min="0" max="100" step="any"></label></div>
 <div class="mm" data-m="grade" hidden><label>IB grade<select name="gr">${[7,6,5,4,3,2,1].map(g=>`<option>${g}</option>`).join("")}</select></label></div>
 <div class="row"><label>Note (optional)<input name="note" maxlength="80"></label></div><button class="pri" type="submit">Add score</button></form>
 <div class="card" style="margin-top:0"><h3>Recent scores</h3>${rec.length?`<ul class="ins" style="list-style:none;padding:0">`+rec.map(i=>{const s=S.subjects.find(x=>x.id===i.sub);return`<li class="bl"><span>${esc(s?s.name:"?")}: ${esc(i.type)}</span><span>${r1(i.pct)}% <button class="x" data-del="${i.id}" aria-label="Delete this score">×</button></span></li>`}).join("")+`</ul>`:'<p class="none">Nothing yet.</p>'}<p class="lg">Every score counts equally in your subject average. Use the note field for any extra context.</p></div></div>`}
function vGl(){const o=overall(),pp=projPts(o),sel=S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
 let h=`<h2 class="t">Goals</h2><p class="sub">How your marks compare with what you need.</p><div class="g2b"><div class="card" style="margin-top:0"><h3>Universities</h3><p class="lg">For detailed university + major selection, use the Universities tab. Targets entered here are manual and should be verified against official programme pages.</p>`+

 else if(/MUN|debate|Competition/i.test(event.type))steps.push([Math.max(1,Math.round(days*.8)),"Understand rules, judging criteria and expectations",hours*.15],[Math.max(1,Math.round(days*.6)),"Research, collect evidence and build your approach",hours*.35],[Math.max(1,Math.round(days*.35)),"Practise / get feedback / improve your work",hours*.35],[1,"Final check and prepare materials",hours*.15]);
 else steps.push([Math.max(1,Math.round(days*.7)),"Break the event into smaller steps",hours*.3],[Math.max(1,Math.round(days*.35)),"Complete the main work and check requirements",hours*.5],[1,"Final check and prepare what you need",hours*.2]);
 return steps.map((st,i)=>{let due=new Date(d);due.setDate(due.getDate()-st[0]);return{id:uid(),eventId:event.id,title:event.title+": "+st[1],date:due.toISOString().slice(0,10),hours:r1(st[2]),done:false,generated:true}}).filter(t=>t.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));}
function vCal(){const events=(S.events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)),tasks=(S.tasks||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)),now=today(),interest=S.interest||"Economics",ideas=(INTERESTS[interest]||INTERESTS.Economics).activities;const upcoming=events.filter(e=>e.date>=now),todo=tasks.filter(t=>!t.done&&t.date>=now);return `<h2 class="t">Calendar & preparation</h2><p class="sub">Add your deadlines and events. Ledger suggests when to start and creates preparation tasks. These are starting estimates—adjust them to fit your workload.</p>
 <div class="stats"><div class="card stat"><span>Upcoming events</span><b>${upcoming.length}</b><small>Events with dates ahead</small></div><div class="card stat"><span>Tasks to do</span><b>${todo.length}</b><small>Generated and personal tasks</small></div><div class="card stat"><span>Next deadline</span><b style="font-size:19px">${upcoming[0]?esc(upcoming[0].date):"—"}</b><small>${upcoming[0]?esc(upcoming[0].title):"Add an event to begin"}</small></div></div>

 <div class="card"><h3>Upcoming events</h3>${events.length?`<div class="tw"><table><thead><tr><th>Due</th><th>Event</th><th>Type</th><th>Topics</th><th>Prep time</th><th></th></tr></thead><tbody>${events.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}${e.priority&&e.priority!=="Normal"?`<br><span class="chip low">${esc(e.priority)} priority</span>`:""}</td><td>${esc(e.type)}</td><td>${esc(e.topics||"—")}</td><td>${r1(+e.hours||0)} h</td><td><button class="x" data-delevent="${e.id}" aria-label="Delete event">×</button></td></tr>`).join("")}</tbody></table></div>`:'<p class="none">No events yet. Add exams, SDLs, assignments, competitions and due dates above.</p>'}</div>
 <div class="card"><h3>Your preparation tasks</h3><p class="lg">Tick tasks off as you complete them. Generated tasks are spread backwards from each event date.</p>${tasks.length?`<ul class="ins" style="list-style:none;padding:0">${tasks.map(t=>`<li class="bl"><span><label style="display:inline-flex;gap:8px;align-items:flex-start;margin:0"><input type="checkbox" data-taskdone="${t.id}" ${t.done?"checked":""}><span style="${t.done?"text-decoration:line-through;opacity:.65":""}"><b>${esc(t.date)}</b> · ${esc(t.title)} <small>(${r1(+t.hours||0)} h)</small></span></label></span><button class="x" data-deltask="${t.id}" aria-label="Delete task">×</button></li>`).join("")}</ul>`:'<p class="none">Your preparation plan will appear here after you add an event.</p>'}<form id="ftask" style="margin-top:14px"><h3>Add a personal task</h3><label>Task<input name="title" required maxlength="120" placeholder="e.g. Finish history source analysis"></label><div class="row"><label>Due date<input name="date" type="date" required value="${today()}"></label><label>Time needed (hours)<input name="hours" type="number" min="0.25" max="24" step="0.25" value="1" required></label></div><button class="pri" type="submit">Add task</button></form></div>
 <div class="card"><h3>Free time? Try a small major-related activity</h3><p class="lg">Your current interest is <b>${esc(interest)}</b>. Choose something that fits the time you have—these are optional ideas, not extra homework.</p><ul class="ins">${ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="lg">Quick options: 20–30 minutes = read/watch and write 3 takeaways; 1–2 hours = mini research or a short analysis; a free weekend = create a small project and record what you learned.</p><button type="button" class="pri" data-v="un">Change my interest</button></div>`}
const CRITERIA=["A","B","C","D"];
function vCr(){const rows=S.criteria||[],subjects=S.subjects||[],by={};rows.forEach(r=>{const k=r.sub+"|"+r.criterion;(by[k]||(by[k]=[])).push(r)});const summaries=subjects.map(s=>{const av=CRITERIA.map(c=>{const a=rows.filter(r=>r.sub===s.id&&r.criterion===c);return{c,avg:a.length?a.reduce((n,x)=>n+(+x.pct||0),0)/a.length:null,count:a.length}}).filter(x=>x.avg!==null);return{s,av,best:av.length?[...av].sort((a,b)=>b.avg-a.avg)[0]:null,worst:av.length?[...av].sort((a,b)=>a.avg-b.avg)[0]:null}});return `<h2 class="t">Criteria & topic tracker</h2><p class="sub">Record each assessment's topic and Criterion A, B, C or D score. Ledger will show your strongest and weakest criteria by subject and suggest what to practise next.</p>
 <div class="card"><h3>Record a criterion score</h3><form id="fcriterion"><div class="row"><label>Subject<select name="sub" required>${subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label><label>Assessment type<select name="type">${TYPES.map(x=>`<option>${x}</option>`).join("")}</select></label></div><label>Topic / unit name<input name="topic" required maxlength="120" placeholder="e.g. Industrial Revolution — causes of imperialism"></label><div class="row"><label>Criterion<select name="criterion">${CRITERIA.map(c=>`<option value="${c}">Criterion ${c}</option>`).join("")}</select></label><label>Score received<input name="score" type="number" min="0" step="0.5" value="6" required></label><label>Maximum score<input name="max" type="number" min="1" step="0.5" value="10" required></label></div><div class="row"><label>Date<input name="date" type="date" value="${today()}" required></label><label>What went well / what was difficult<input name="note" maxlength="240" placeholder="e.g. good evidence, weak explanation"></label></div><button class="pri" type="submit">Save criterion result</button></form></div>
 <div class="card"><h3>Your strongest and weakest criteria</h3><p class="lg">Averages are calculated only from the results you enter. A criterion with one score is less reliable than one with several assessments.</p>${summaries.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(x.s.name)}</b>${x.av.length?`<p style="margin:6px 0">Strongest: <b>Criterion ${x.best.c}</b> (${r1(x.best.avg)}%) · Needs most practice: <b>Criterion ${x.worst.c}</b> (${r1(x.worst.avg)}%)</p><div class="bl"><span>Criterion averages</span><span></span></div>${CRITERIA.map(c=>{const z=x.av.find(a=>a.c===c);return`<div class="bl"><span>Criterion ${c} ${z?`(${z.count} result${z.count===1?"":"s"})`:"(no scores yet)"}</span><span>${z?r1(z.avg)+"%":"—"}</span></div>${z?`<div class="bar"><i style="width:${Math.min(100,z.avg)}%"></i></div>`:""}`}).join("")}`:'<p class="lg">No criterion scores entered for this subject yet.</p>'}</div>`).join("")}</div>
 <div class="card"><h3>What should I practise?</h3>${(()=>{const weak=summaries.filter(x=>x.worst).sort((a,b)=>a.worst.avg-b.worst.avg).slice(0,5);if(!weak.length)return'<p class="none">Add your first result above. Suggestions will be based on the criteria where your recorded average is lowest.</p>';return `<ul class="ins">${weak.map(x=>{const c=x.worst.c,tip={A:"Practise subject knowledge, key terms, accurate examples and answering exactly what the question asks.",B:"Practise planning investigations or methods, choosing relevant evidence/data, and explaining your approach clearly.",C:"Practise organising your answer, using evidence, explaining reasoning step by step, and checking that each paragraph answers the question.",D:"Practise evaluating strengths and limitations, considering different perspectives, and linking your conclusion to real-world examples."}[c];const topic=rows.filter(r=>r.sub===x.s.id&&r.criterion===c).sort((a,b)=>(+a.pct)-(+b.pct))[0];return`<li><b>${esc(x.s.name)} — Criterion ${c} (${r1(x.worst.avg)}% average):</b> ${tip}${topic?` Start with your lower-scoring topic: <b>${esc(topic.topic)}</b>.`:""}</li>`}).join("")}</ul><p class="lg">These are general Criterion A–D practice prompts; your school's exact rubric may define each criterion differently by subject and task. Follow your teacher's rubric first.</p>`})()}</div>
 <div class="card"><h3>Assessment history</h3>${rows.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Subject</th><th>Assessment</th><th>Topic</th><th>Criterion</th><th>Score</th><th></th></tr></thead><tbody>${[...rows].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const s=subjects.find(x=>x.id===r.sub);return`<tr><td>${esc(r.date)}</td><td>${esc(s?s.name:"Subject removed")}</td><td>${esc(r.type)}</td><td>${esc(r.topic)}</td><td>${esc(r.criterion)}</td><td>${r.score}/${r.max} (${r1(r.pct)}%)</td><td><button class="x" data-delcriterion="${r.id}" aria-label="Delete result">×</button></td></tr>`}).join("")}</tbody></table></div>`:'<p class="none">No criterion results recorded yet.</p>'}</div>`}

function render(){if(!S)V="st";$("#nav").querySelectorAll("[data-v]").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===V);b.disabled=!S&&b.dataset.v!=="st"});
 $("#view").innerHTML=({ov:vOv,sb:vSb,ad:vAd,gl:vGl,un:vUn,ex:vEx,pl:vPl,cal:vCal,cr:vCr,st:vSt})[V]();if(V==="gl"&&S.subjects.length)calc()}

 $("#wout").innerHTML=st.W===0?`To finish on grade ${g} you need about <b>${r1(lo(g))}%</b> on everything.`:nd<=0?`You already hold the ${g} bar. Even 0% on the next ${n} would keep it.`:nd>100?`Grade ${g} is out of reach with only ${n} more assessments. Try more assessments or a lower target.`:`To reach grade ${g} you need about <b>${r1(nd)}%</b> on average across your next ${n} assessments.`;
 const p=+$("#xp").value,nw=st.W+1,na=((st.avg||0)*st.W+p)/nw;$("#xout").innerHTML=`Your ${esc(s.name)} average would move from ${st.avg==null?"–":r1(st.avg)+"%"} to <b>${r1(na)}%</b> (grade ${gradeOf(na)}).`}

  if(da){S.activities=(S.activities||[]).filter(a=>a.id!==da.dataset.delact);save();render();return toast("Activity deleted")}

  if(a==="reset"&&confirm("Erase all your scores and settings from this browser?")){S=null;try{localStorage.removeItem(KEY)}catch(x){}go("st")}}});

 if(f.id==="ftask"){S.tasks=S.tasks||[];S.tasks.push({id:uid(),title:String(fd.get("title")||"").trim(),date:fd.get("date"),hours:+fd.get("hours")||1,done:false,generated:false});save();toast("Task added");return render()}

 if(f.id==="funi"){let n=String(fd.get("n")||"").trim();if(n==="Other university")n=String(fd.get("othern")||"").trim();if(!n)return toast("Enter the university name");let program=String(fd.get("otherprogram")||"").trim()||String(fd.get("program")||"").trim();if(!program||program==="Other / enter below")return toast("Choose or enter a major");const u=uniByName(n);S.unis=S.unis||[];S.unis.push({id:uid(),n,program,pts:fd.get("pts")===""?null:+fd.get("pts"),entry:fd.get("entry")||"",url:String(fd.get("url")||"").trim()||(u?u.url:""),ec:String(fd.get("ec")||"").trim()});save();toast("University and major saved");return render()}

 if(f.id==="fu"){S.unis.push({id:uid(),n:String(fd.get("n")).trim(),pts:+fd.get("pts"),note:String(fd.get("note")||"").trim()});save();return render()}
 if(f.id==="fs"){const b=fd.getAll("b").map(Number);if(b.some((x,i)=>!(x>0)||(i&&x>=b[i-1])))return toast("Boundaries must go down from grade 7 to grade 2");
